name: "🔒 Secret-Guard — Zero Plaintext PAT & Symmetric Encryption Check"

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-guard:
    name: "Block Unencrypted PATs & Verify Symmetric Encryption"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History for Leak Detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Gate 1 — Scan Working Tree & Remotes for Plaintext PATs/Secrets"
        run: |
          python3 .github/scripts/secret_guard.py scan --all

      - name: "Gate 2 — Scan Git Commit History for Leaked PATs"
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path(".github/scripts").resolve()))
          import secret_guard

          # Inspect the last 25 commits for any accidentally introduced & removed PAT
          log = subprocess.run(
              ["git", "log", "-n", "25", "-p", "--no-color"],
              capture_output=True, text=True, encoding="utf-8", errors="ignore"
          ).stdout
          errors = []
          for idx, line in enumerate(log.splitlines(), start=1):
              if not line.startswith("+") or line.startswith("+++"):
                  continue
              if secret_guard.is_line_allowlisted(line):
                  continue
              cleaned = secret_guard.ENVELOPE_REGEX.sub("", line)
              for rule_name, pattern in secret_guard.HIGH_CONFIDENCE_PATTERNS:
                  m = pattern.search(cleaned)
                  if m:
                      matched = m.group(0)
                      low = matched.lower()
                      if any(ph in low for ph in secret_guard.SAFE_PLACEHOLDERS) or "xxxx" in low:
                          continue
                      preview = matched[:6] + "..." + matched[-4:] if len(matched) > 14 else "***"
                      errors.append(f"[git-history line {idx}] {rule_name} ({preview})")
          if errors:
              print("🛑 SECRET-GUARD : PAT ou secret détecté dans l'historique Git récent !", file=sys.stderr)
              for e in errors[:20]:
                  print("  ", e, file=sys.stderr)
              sys.exit(1)
          print("✅ Historique Git récent vérifié : aucun PAT ou secret en clair.")
          EOF

      - name: "Gate 3 — Verify Encrypted Secrets (ENC[SYM256,...]) with Symmetric Key"
        env:
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
        run: |
          python3 .github/scripts/secret_guard.py verify-encrypted
